version: "v1.0"
name: passkit
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
auto_cancel:
  running:
    when: "true"

blocks:
  - name: tests
    execution_time_limit:
      minutes: 10
    task:
      env_vars:
        - name: RAILS_ENV
          value: test
        - name: BUNDLE_PATH
          value: vendor/bundle
      prologue:
        commands:
          - checkout --use-cache
          - sem-version ruby ${RUBY_VERSION:-3.4}
          - export GEMS_CACHE_KEY=gems-${RUBY_VERSION:-3.4}-${RUBYZIP_VERSION:-latest}-$(checksum passkit.gemspec)-$(checksum Gemfile)
          - cache restore $GEMS_CACHE_KEY
          - bundle install -j 4
          - cache store $GEMS_CACHE_KEY vendor/bundle
          - bin/generate_test_certificates
      jobs:
        - name: linter
          commands:
            - bundle exec standardrb
        - name: tests
          matrix:
            - env_var: RUBY_VERSION
              values: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
          commands:
            - bundle exec rake test
        - name: tests with the lowest rubyzip
          matrix:
            - env_var: RUBYZIP_VERSION
              values: ["3.4.0"]
          commands:
            - bundle exec rake test
        - name: system tests
          commands:
            - bundle exec rake test:system

promotions:
  - name: Release gem
    pipeline_file: release.yml
